<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RN TOP UP</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

.header {
  text-align: center;
  padding: 25px 15px;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
}

.logo {
  font-size: 32px;
  font-weight: bold;
}

.subtitle {
  margin-top: 8px;
  font-size: 15px;
}

.container {
  max-width: 450px;
  margin: 25px auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h2 {
  text-align: center;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  background: #334155;
  color: white;
  outline: none;
}

.package {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}

.package button {
  padding: 15px 8px;
  border: 2px solid #475569;
  border-radius: 12px;
  background: #334155;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.package button:hover {
  border-color: #8b5cf6;
}

.pay {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #22c55e;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.pay:hover {
  background: #16a34a;
}

.info {
  margin-top: 18px;
  padding: 12px;
  background: #0f172a;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
  color: #cbd5e1;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #94a3b8;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">💎 RN TOP UP</div>
  <div class="subtitle">Free Fire Diamond Top Up</div>
</div>

<div class="container">

  <div class="card">

    <h2>💎 Buy Diamonds</h2>

    <label>Free Fire Player ID</label>
    <input
      type="number"
      id="playerId"
      placeholder="Enter your Player ID"
    >

    <label>Select Diamond Package</label>

    <div class="package">

      <button onclick="selectPackage(100, 90)">
        💎 100<br>
        90 ETB
      </button>

      <button onclick="selectPackage(310, 270)">
        💎 310<br>
        270 ETB
      </button>

      <button onclick="selectPackage(520, 450)">
        💎 520<br>
        450 ETB
      </button>

      <button onclick="selectPackage(1060, 890)">
        💎 1060<br>
        890 ETB
      </button>

      <button onclick="selectPackage(2180, 1750)">
        💎 2180<br>
        1750 ETB
      </button>

      <button onclick="selectPackage(5600, 4300)">
        💎 5600<br>
        4300 ETB
      </button>

    </div>

    <label>Selected Package</label>
    <input
      type="text"
      id="selectedPackage"
      placeholder="Choose a package above"
      readonly
    >

    <button class="pay" onclick="payNow()">
      💳 PAY NOW
    </button>

    <div class="info">
      🔒 Secure Payment<br>
      💰 Payment will be processed securely.<br>
      ⚡ Diamonds will be delivered after successful payment.<br>
      ❌ Never share your Free Fire password.
    </div>

  </div>

</div>

<div class="footer">
  © 2026 RN TOP UP — All Rights Reserved
</div>

<script>

let selectedDiamonds = 0;
let selectedPrice = 0;

function selectPackage(diamonds, price) {

  selectedDiamonds = diamonds;
  selectedPrice = price;

  document.getElementById("selectedPackage").value =
    diamonds + " Diamonds - " + price + " ETB";
}

function payNow() {

  const playerId = document.getElementById("playerId").value;

  if (playerId === "") {
    alert("Please enter your Free Fire Player ID.");
    return;
  }

  if (selectedDiamonds === 0) {
    alert("Please select a Diamond package.");
    return;
  }

  alert(
    "Order ready!\\n\\n" +
    "Player ID: " + playerId + "\\n" +
    "Diamonds: " + selectedDiamonds + "\\n" +
    "Price: " + selectedPrice + " ETB\\n\\n" +
    "Chapa payment will be connected next."
  );
}

</script>

</body>
</html>
