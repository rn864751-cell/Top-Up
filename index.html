<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top-Up Service</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #222;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1769e0;
    }

    p {
      text-align: center;
      color: #666;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d55bd;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Top-Up</h1>
    <p>Fast and Easy Top-Up Service</p>

    <label>Network</label>
    <select id="network">
      <option value="">Select Network</option>
      <option value="Ethio Telecom">Ethio Telecom</option>
      <option value="Safaricom">Safaricom</option>
    </select>

    <label>Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="09XXXXXXXX"
    >

    <label>Amount (ETB)</label>
    <input
      type="number"
      id="amount"
      placeholder="Enter amount"
      min="1"
    >

    <button onclick="topUp()">Continue</button>

    <div id="message"></div>

  </div>

  <script>
    function topUp() {

      const network = document.getElementById("network").value;
      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;
      const message = document.getElementById("message");

      if (!network || !phone || !amount) {
        message.innerHTML = "⚠️ Please fill in all fields.";
        return;
      }

      message.innerHTML =
        "✅ Order received. Payment integration will be added next.";

    }
  </script>

</body>
</html>
